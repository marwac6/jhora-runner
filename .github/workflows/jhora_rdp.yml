name: JHora Serverless RDP

on:
  workflow_dispatch:

jobs:
  provision-vm:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/quiet" -Wait

      - name: Authenticate Tailscale Network
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=jhora-vm --accept-routes --unattended

      - name: Enable Remote Desktop & Configure Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "${{ secrets.RDP_PASSWORD }}"

      - name: Keep-Alive Loop (6-Hour Window)
        run: Start-Sleep -Seconds 21600
